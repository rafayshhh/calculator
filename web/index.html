<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Calculator - High performance cross-platform mathematical suite and calculator with 150 tools by Muhammad Abdul Rafay (@rafayshhh).">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Calculator">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Calculator</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0B0F19;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #00E5FF;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(0, 229, 255, 0.2);
      border-radius: 50%;
      border-top-color: #00E5FF;
      animation: spin 0.8s ease-in-out infinite;
    }
    .title {
      margin-top: 18px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #FFFFFF;
    }
    .subtitle {
      margin-top: 6px;
      font-size: 12px;
      color: #78909C;
      letter-spacing: 1px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="title">CALCULATOR</div>
    <div class="subtitle">150 MATHEMATICAL TOOLS</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
